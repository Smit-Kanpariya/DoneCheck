[project]
name = "donecheck"
version = "0.1.0"
description = "Checks whether a coding agent's \"done\" is backed by evidence in its run record"
readme = "README.md"
authors = [
    { name = "Smit-Kanpariya", email = "155396918+Smit-Kanpariya@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.5",
    "scikit-learn>=1.9.1",
    "typer>=0.29.1",
]

[project.scripts]
donecheck = "donecheck.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
